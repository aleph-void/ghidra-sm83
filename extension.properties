name=SM83
description=Sharp SM83 (Game Boy CPU, LR35902) processor module: SLEIGH disassembly and p-code for every defined opcode, Game Boy ROM and boot ROM loader with banked memory, hardware registers and data types, bank-switching, interrupt, jump-table and RAM-code analyzers, SDCC/GBDK calling conventions and a symbol file import script. Based on minorum/ghidra-sm83 (Apache-2.0), itself a continuation of Gekkio/GhidraBoy.
